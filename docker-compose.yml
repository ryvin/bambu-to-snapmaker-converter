services:
  converter:
    build: .
    container_name: bambu-to-u1-converter
    ports:
      - "8090:8080"
    volumes:
      # Persist conversion history and settings
      - ./data:/app/data
      # Mount E:\ drive for file access
      - /mnt/e:/mnt/e
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
